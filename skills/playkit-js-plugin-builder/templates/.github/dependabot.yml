version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major bumps land as individual PRs, not grouped, so a breaking change is reviewed on its own.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
